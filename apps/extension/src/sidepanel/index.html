<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghostly247</title>
  </head>
  <!--
    The panel owns the full height of its window and never scrolls as a whole —
    Panel's body is the only scroll container, so the top bar, tabs and status
    bar stay put at any panel width.
  -->
  <body class="h-screen w-full overflow-hidden bg-canvas">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
